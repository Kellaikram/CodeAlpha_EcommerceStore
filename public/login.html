<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body data-page="login"><header></header><main>
<div id="msg"></div><div class="form"><h2>Login</h2><form id="loginForm"><input id="lemail" type="email" placeholder="Email" required><input id="lpass" type="password" placeholder="Password" required><button class="btn">Login</button></form>
